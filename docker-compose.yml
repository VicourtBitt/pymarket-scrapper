services:
  postgres:
    image: postgres:16-alpine
    container_name: scraping_db
    environment:
      # Administrative superuser; used only for initialization.
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      # Least-privilege role the application and Alembic connect as.
      APP_DB_USER: ${APP_DB_USER:-pymarket_scrapper}
      APP_DB_PASS: ${APP_DB_PASS:?APP_DB_PASS is required}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executed only when pgdata is empty (first start).
      - ./db_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
